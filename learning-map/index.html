-deep-dive.md-11", "t": "演进史与速查", "hook": "Python → Go 迁移；模板清单；参数总表", "children": []}]}]}];
const TIPS = [["先全景后细节", "每份文档先读「速览表 + 全流程图」建立图式，再进讲次。大脑对已有框架的信息吸收率远高于碎片。"], ["一讲一个钩子", "思维导图每个叶子都是\"能脱口而出的一句话\"。复述时先讲钩子，再回头补细节。"], ["精细提问", "读完问自己三个\"为什么\"：为什么是这个阈值？为什么不是另一种结构？为什么这样取舍？"], ["提取练习", "合上书，在纸上重画本图。画不下去的地方就是没学会的地方，回去只补那一块。"], ["间隔重复", "按右侧复习节奏回看各文档末尾的「复习卡」：D1 / D3 / D7 / D14 / D30。"], ["交错对比", "同层组件横向对比（MySQL↔Redis↔ES 的写路径、Kafka↔Nacos 的一致性），比顺序递进更抗遗忘。"], ["双编码", "文字 + mermaid 图一起记，同一信息两种表征，回忆时多一条线索。"]];
const REVIEW = [["D1", "当天晚上", "只看思维导图叶子钩子，合书复述；卡住的位置标星"], ["D3", "第 3 天", "回看该文档「面试速通」高频 Q&A，先答后对"], ["D7", "第 7 天", "做文档末尾「复习卡」，错的抄进错题本"], ["D14", "第 14 天", "与同阶段另一份文档做交错对比（见对比题组）"], ["D30", "第 30 天", "全图重画一次，能脱稿讲完一条主线即过关"]];
const INTER = [["写路径对照", "MySQL（buffer pool + redo）· Redis（aof_fsync 三策略）· ES（Translog + Refresh/Flush）"], ["一致性对照", "Kafka（ISR + 水位）· Nacos（distro AP vs JRaft CP）· Agones（乐观并发 + status 非 subresource）"], ["锁与并发对照", "synchronized（ObjectMonitor 混合队列）· AQS（CLH 变体）· CHM（synchronized 桶锁 + CAS）"], ["请求处理对照", "Spring MVC（doDispatch 九步）· Redis（processCommand 链）· Kafka（Processor + Purgatory）"]];

const W = {stage:196, doc:214, lec:272};
const X = [0, 224, 466];
const LINE_H = 46, GAP = 12;
let nodes = [], links = [], rootH = 0, collapsed = new Set();

const stage = document.getElementById('stage');
const svg = document.getElementById('line');
const nl = document.getElementById('nodes');

function countLeaves(n){
  if(!n.children || !n.children.length) return 1;
  let h=0; for(const c of n.children) h += countLeaves(c);
  return h;
}

function layout(n, depth, y){
  n.depth = depth;
  if(!n.children || !n.children.length || collapsed.has(n.id)){
    n.y = y; n.h = (depth===2 ? LINE_H : (depth===1 ? 62 : 66));
    n.sub = countLeaves(n);
    return n.h;
  }
  let cy = y;
  for(const c of n.children){ const ch = layout(c, depth+1, cy); cy += ch + GAP; }
  const first = n.children[0], last = n.children[n.children.length-1];
  n.y = (first.y + first.h/2 + last.y + last.h/2)/2 - 33;
  n.h = 66;
  return cy - GAP - y;
}

function draw(){
  const y = 60;
  rootH = layout({id:'__root__', children:DATA}, -1, y) ;
  nodes = []; links = [];
  walk(DATA, 0, 60);
  let maxY = 0;
  for(const n of nodes){ maxY = Math.max(maxY, n.y + n.h); }
  const H = Math.max(maxY + 80, 900);
  svg.setAttribute('width', X[2]+W.lec+400); svg.setAttribute('height', H);
  svg.style.width = (X[2]+W.lec+400)+'px'; svg.style.height = H+'px';
  nl.style.width = (X[2]+W.lec+400)+'px'; nl.style.height = H+'px';
  let paths = '';
  for(const l of links){
    const x1 = l.x1, y1 = l.y1, x2 = l.x2, y2 = l.y2, mx = (x1+x2)/2;
    paths += `<path d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}" fill="none" stroke="${l.color}" stroke-width="${l.w}" opacity="${l.o}"/>`;
  }
  svg.innerHTML = paths;
  let html = '';
  for(const n of nodes) html += render(n);
  nl.innerHTML = html;
  applyFilter();
}

function walk(list, depth, y){
  for(const n of list){
    n.x = X[depth];
    n.w = depth===0 ? W.stage : (depth===1 ? W.doc : W.lec);
    nodes.push(n);
  }
  for(const n of list){
    if(n.children && n.children.length && !collapsed.has(n.id)){
      walk(n.children, depth+1, y);
      for(const c of n.children){
        links.push({x1:n.x+n.w+4, y1:n.y+n.h/2, x2:c.x-4, y2:c.y+c.h/2,
                    color:n.color||'#c7cdd8', w: depth===0?2:1.4, o: depth===0?.9:.65});
      }
    }
  }
}

function render(n){
  const closed = n.children && n.children.length && collapsed.has(n.id);
  const cls = 'node ' + (n.depth===0?'stage':n.depth===1?'doc':'lec') + (closed?' closed':'');
  const style = n.depth===0 ? `background:${n.color};` : `border-left:4px solid ${n.color};`;
  let inner = `<div class="t">`;
  if(n.children && n.children.length) inner += `<span class="caret"></span>`;
  inner += esc(n.t) + (closed && n.sub?` <span style="font-weight:400;opacity:.65;font-size:11px">(${n.sub})</span>`:'') + `</div>`;
  if(n.depth===0 && n.g) inner += `<div class="g">${esc(n.g)}</div>`;
  if(n.depth===1 && n.s) inner += `<div class="s">${esc(n.s)}</div>`;
  if(n.depth===2 && n.hook) inner += `<div class="h">${esc(n.hook)}</div>`;
  return `<div class="${cls}" id="n_${n.id}" style="left:${n.x}px;top:${n.y}px;width:${n.w}px;${style}">${inner}</div>`;
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

// 折叠
nl.addEventListener('click', e=>{
  const el = e.target.closest('.node'); if(!el) return;
  const n = nodes.find(x=>'n_'+x.id===el.id);
  if(n && n.children && n.children.length){
    collapsed.has(n.id) ? collapsed.delete(n.id) : collapsed.add(n.id);
    draw();
  }
});

// 平移缩放
let panX=30, panY=0, zoom=1, sx=0, sy=0, dragging=false;
const app=document.getElementById('app');
function apply(){ stage.style.transform = `translate(${panX}px,${panY}px) scale(${zoom})`; }
app.addEventListener('mousedown', e=>{ if(e.target.closest('.node'))return; dragging=true; sx=e.clientX; sy=e.clientY; app.classList.add('drag'); });
window.addEventListener('mousemove', e=>{ if(!dragging)return; panX += e.clientX-sx; panY += e.clientY-sy; sx=e.clientX; sy=e.clientY; apply(); });
window.addEventListener('mouseup', ()=>{ dragging=false; app.classList.remove('drag'); });
app.addEventListener('wheel', e=>{ e.preventDefault(); const k = e.deltaY<0?1.1:0.9;
  const r=app.getBoundingClientRect(); const mx=e.clientX-r.left, my=e.clientY-r.top;
  const nz = Math.min(2.2, Math.max(0.28, zoom*k)); const f=nz/zoom;
  panX = mx - (mx-panX)*f; panY = my - (my-panY)*f; zoom=nz; apply(); }, {passive:false});

// 搜索
const inp = document.getElementById('q');
function applyFilter(){
  const q = inp.value.trim().toLowerCase();
  for(const n of nodes){
    const el = document.getElementById('n_'+n.id); if(!el) continue;
    if(!q){ el.classList.remove('dim','hit'); continue; }
    const hay = (n.t + ' ' + (n.hook||'') + ' ' + (n.g||'') + ' ' + (n.s||'')).toLowerCase();
    if(hay.includes(q)){ el.classList.remove('dim'); el.classList.add('hit'); }
    else { el.classList.remove('hit'); el.classList.add('dim'); }
  }
}
inp.addEventListener('input', applyFilter);

document.getElementById('exp').onclick = ()=>{ collapsed.clear(); draw(); };
document.getElementById('col').onclick = ()=>{
  collapsed.clear();
  for(const s of DATA){ collapsed.add(s.id); for(const d of s.docs||[]) collapsed.add(d.id); }
  draw();
};
document.getElementById('fit').onclick = ()=>{ panX=30; panY=0; zoom=1; apply(); };
document.getElementById('mid').onclick = ()=>{
  collapsed.clear();
  for(const s of DATA){ collapsed.add(s.id); }
  draw(); panX=30; panY=0; zoom=1; apply();
};

// 复习节奏面板
(function(){
  const el = document.getElementById('legend');
  let h = `<h4>图例 · 六条主线</h4>`;
  for(const s of DATA) h += `<div class="row"><span class="sw" style="background:${s.color}"></span>${esc(s.t)}</div>`;
  h += `<div style="height:1px;background:#e5e7eb;margin:8px 0"></div><h4>间隔重复节奏</h4>`;
  for(const r of REVIEW) h += `<div class="row"><b class="mm" style="width:34px;color:#111827">${r[0]}</b>${esc(r[1])}</div>`;
  h += `<div style="height:1px;background:#e5e7eb;margin:8px 0"></div><h4>交错对比题组</h4>`;
  for(const i of INTER) h += `<div class="row" style="display:block"><b style="color:#111827">${esc(i[0])}</b><br>${esc(i[1])}</div>`;
  h += `<div style="height:1px;background:#e5e7eb;margin:8px 0"></div><h4>记忆法</h4>`;
  for(const t of TIPS) h += `<div class="row" style="display:block"><b style="color:#111827">${esc(t[0])}</b> ${esc(t[1])}</div>`;
  el.innerHTML = h;
})();

apply(); draw();
</script>
